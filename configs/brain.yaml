# Brain process configuration — LLM / VLM / LCM parameters

llm:
  backend: deepseek               # deepseek

vlm:
  backend: qwen                    # qwen | deepseek | openai
  qwen:
    model: qwen2.5-vl-72b-instruct
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  deepseek:
    model: deepseek-vl2
    base_url: https://api.deepseek.com
  openai:
    model: gpt-4o

lcm:
  subscribe:
    - channel: /odom
    - channel: /camera_rgb
  publish:
    cmd_vel:
      channel: /cmd_vel
      linear_scale: 5.0
      angular_scale: 3.0

logging:
  level: INFO
  file: logs/brain.log
