[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robomind"
dynamic = ["version"]
description = "Embodied robot control with a dual-process body/brain architecture over LCM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "waliwuao", email = "waliwuao@users.noreply.github.com" },
]
keywords = [
    "robotics",
    "embodied-ai",
    "llm",
    "vlm",
    "lcm",
    "omnigibson",
    "isaac-sim",
    "task-planning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "lcm",
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
]

[project.scripts]
robomind-body = "robomind.body:main"
robomind-brain = "robomind.brain:main"

[project.urls]
Homepage = "https://github.com/WallyHao/robomind"
Repository = "https://github.com/WallyHao/robomind"
Issues = "https://github.com/WallyHao/robomind/issues"
Changelog = "https://github.com/WallyHao/robomind/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robomind = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "robomind.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=robomind --cov-report=term-missing"
